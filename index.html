      <p id="subtitle">현대 판타지 투자 게임</p>
    </div>
    <div class="days" id="days"></div>
    <div class="purse">
      <div><span>현금</span><span class="num" id="cash">5,000</span></div>
      <div><span>총자산</span><span class="num" id="equity">5,000</span></div>

  </header>

  <div class="grid">
    <div class="col left">
      <section class="panel m-pane" id="sec-watch" aria-labelledby="w-h">
        <div class="panel-head"><h2 id="w-h">종목</h2><span>전일 종가 대비</span></div>

        <div class="panel-head"><h2 id="p-h">보유 현황</h2><span>시장 계좌</span></div>
        <div class="positions" id="positions"></div>
      </section>
    </div>

    <section class="panel stage m-pane" id="stage" aria-live="polite"></section>

    <div class="col right">

      </section>
      <section class="panel m-pane" id="sec-feed" aria-labelledby="f-h">
        <div class="panel-head"><h2 id="f-h">소식</h2><span>최신순</span></div>
        <ul class="feed" id="feed"></ul>
      </section>
    </div>
  </div>
